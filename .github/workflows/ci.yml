name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every class-A gate active at the repository's current milestone
  # (gates.json). No Ruby is needed: generated payloads are committed.
  gates:
    runs-on: ubuntu-latest
    steps:
      # The conformance cases live in the plurimath-testsuite submodule. Without
      # this the reader finds nothing — and fails loudly rather than passing an
      # empty suite, but the job would fail for the wrong reason.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Build-time requirement of tsdown 0.22.14 (^22.18.0 || >=24.11.0);
          # the published package supports Node 20+ at runtime.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Ruby-backed unit regressions are class B, isolated from the Node-only
  # class-A suite and run with an explicit interpreter rather than relying on
  # whatever happens to be installed on the runner image.
  oracle-runner-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:oracle-unit

  # Guards the runtime support claim in package.json#engines.
  runtime-matrix:
    runs-on: ubuntu-latest
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      # The conformance cases live in the plurimath-testsuite submodule. Without
      # this the reader finds nothing — and fails loudly rather than passing an
      # empty suite, but the job would fail for the wrong reason.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
