name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      leptris_probe:
        description: Build a candidate Leptris binding and run the opt-in XML consumer gate
        type: boolean
        default: false
      leptris_repository:
        description: Candidate binding repository
        type: string
        default: leptris/leptris-ts
      leptris_ref:
        description: Candidate binding commit or ref
        type: string
        default: main
      unicode_probe_only:
        description: Skip UnitsML measurements when running the Unicode reference probe
        type: boolean
        default: false
      unicode_unreached_probe:
        description: Also measure still-unreached Unicode rules in the targeted reference job
        type: boolean
        default: false
      native_completion_test:
        description: Run focused native UnitsML and Unicode integration checks
        type: boolean
        default: false
      native_completion_probe:
        description: Measure targeted UnitsML and Unicode reference data
        type: boolean
        default: false
      oracle_artifacts:
        description: Regenerate and verify downloadable oracle artifacts
        type: boolean
        default: false

# Repository token permissions stay read-only. The optional manual job uploads
# artifacts and makes a runner-local verification commit; it never pushes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leptris_probe && 'leptris-probe' || inputs.native_completion_test && 'native-completion-test' || inputs.native_completion_probe && 'native-completion' || inputs.oracle_artifacts && 'oracle-artifacts' || 'checks' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.leptris_probe || inputs.oracle_artifacts || inputs.native_completion_probe || inputs.native_completion_test)) }}

jobs:
  # Every class-A gate active at the repository's current milestone
  # (gates.json). No Ruby is needed: generated payloads are committed.
  gates:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.oracle_artifacts || inputs.native_completion_probe || inputs.native_completion_test)) }}
    runs-on: ubuntu-latest
    # A whole run takes about two minutes, so this is roughly seven times the
    # observed cost -- generous for a slow runner, and still a bound. It is
    # here because vitest 4 builds the worker RPC with `timeout: -1`: the
    # 60-second deadline that used to end a stalled call is gone, and with it
    # the only thing that stopped a genuinely unanswered call from waiting for
    # the 360-minute GitHub default.
    timeout-minutes: 15
    steps:
      # The conformance cases live in the plurimath-testsuite submodule. Without
      # this the reader finds nothing — and fails loudly rather than passing an
      # empty suite, but the job would fail for the wrong reason.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Build-time requirement of tsdown 0.22.14 (^22.18.0 || >=24.11.0);
          # the published package supports Node 20+ at runtime.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Ruby-backed unit regressions are class B, isolated from the Node-only
  # class-A suite and run with an explicit interpreter rather than relying on
  # whatever happens to be installed on the runner image.
  oracle-runner-unit-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.oracle_artifacts || inputs.native_completion_probe || inputs.native_completion_test)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:oracle-unit

  # Guards the runtime support claim in package.json#engines.
  runtime-matrix:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.oracle_artifacts || inputs.native_completion_probe || inputs.native_completion_test)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      # The conformance cases live in the plurimath-testsuite submodule. Without
      # this the reader finds nothing — and fails loudly rather than passing an
      # empty suite, but the job would fail for the wrong reason.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      # Install on Node 24: the `prepare` script builds dist with tsdown, which
      # does not run on Node 20. The tests then run on the matrix version.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - run: pnpm test

  # Expensive generation is opt-in. Standard PR/push jobs above stay unchanged.
  oracle-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.oracle_artifacts }}
    # Evaluation fixtures require the oracle's glibc 2.35 (Ubuntu 22.04).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
    steps:
      - name: Initialize failure evidence before setup
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/oracle-artifacts"
          printf '%s\n' '{"phase":"setup","verified":false,"authoritativeReport":"candidate/report.json"}' > "$RUNNER_TEMP/oracle-artifacts/setup.json"

      - uses: actions/checkout@v5
        with:
          path: source
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          path: verified
          ref: ${{ github.sha }}
          # Retain source ancestry in the downloadable candidate Git bundle.
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: plurimath/plurimath
          ref: 00c52783877b38f6b8e6e109f1803f96bb34fc62
          path: oracle
          persist-credentials: false

      # The upstream checkout ignores Gemfile.lock. These exact bytes preserve
      # its dependency resolution without changing its pinned Git revision.
      - name: Preserve the frozen oracle dependency resolution
        run: cp scripts/ci/oracle/Gemfile.lock ../oracle/Gemfile.lock

      # setup-ruby installs into oracle/vendor/bundle. Ignore only that local
      # dependency tree; tracked oracle changes still fail the clean gate.
      - name: Exclude runner-local oracle dependencies
        working-directory: oracle
        run: printf '%s\n' '/vendor/bundle/' >> "$(git rev-parse --git-path info/exclude)"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler: "4.0.3"
          working-directory: oracle
          bundler-cache: true
        env:
          BUNDLE_FROZEN: "true"

      # Publish the small reference measurement before the expensive sweep.
      - name: Measure the complete Ruby equality reference
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/oracle/Gemfile
          BUNDLE_FROZEN: "true"
        run: |
          bundle exec ruby scripts/probes/corpus-equality.rb --oracle "$GITHUB_WORKSPACE/oracle" > "$RUNNER_TEMP/oracle-artifacts/corpus-equality.txt" 2> "$RUNNER_TEMP/oracle-artifacts/corpus-equality.stderr"

      - name: Retain the early equality reference
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-equality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oracle-artifacts/corpus-equality.txt
            ${{ runner.temp }}/oracle-artifacts/corpus-equality.stderr
          if-no-files-found: error
          retention-days: 7

      - name: Export the unverified generated candidate
        run: >-
          ruby scripts/ci/oracle-artifacts.rb --mode export
          --source "$GITHUB_WORKSPACE/source"
          --oracle "$GITHUB_WORKSPACE/oracle"
          --verify "$GITHUB_WORKSPACE/verified"
          --out "$RUNNER_TEMP/oracle-artifacts/candidate"

      # This is a complete export, not a verified candidate. Upload before the
      # independent regeneration/check pass so its bytes are available early.
      - name: Retain the unverified generated export
        uses: actions/upload-artifact@v4
        with:
          name: oracle-export-unverified-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-artifacts/candidate
          if-no-files-found: error
          retention-days: 7

      - name: Verify the same exported candidate
        run: >-
          ruby scripts/ci/oracle-artifacts.rb --mode verify
          --source "$GITHUB_WORKSPACE/source"
          --oracle "$GITHUB_WORKSPACE/oracle"
          --verify "$GITHUB_WORKSPACE/verified"
          --out "$RUNNER_TEMP/oracle-artifacts/candidate"

      # report.json defaults to verified:false and records individual exits.
      # Failed/partial raw output is useful evidence, never a passing candidate.
      - name: Retain oracle outputs and validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-artifacts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-artifacts
          if-no-files-found: error
          retention-days: 7

  native-completion-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_completion_probe }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    steps:
      - name: Initialize probe evidence
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-completion"
          printf '%s\n' '{"verified":false,"phase":"setup"}' > "$RUNNER_TEMP/native-completion/setup.json"
      - uses: actions/checkout@v5
        with:
          path: source
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: plurimath/plurimath
          ref: 00c52783877b38f6b8e6e109f1803f96bb34fc62
          path: oracle
          persist-credentials: false
      - name: Prepare frozen oracle bundle
        run: |
          cp scripts/ci/oracle/Gemfile.lock ../oracle/Gemfile.lock
          printf '%s\n' '/vendor/bundle/' >> ../oracle/.git/info/exclude
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler: "4.0.3"
          working-directory: oracle
          bundler-cache: true
        env:
          BUNDLE_FROZEN: "true"
      - name: Measure targeted native completion references
        if: ${{ !inputs.unicode_probe_only }}
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/oracle/Gemfile
          BUNDLE_FROZEN: "true"
        run: |
          bundle exec ruby scripts/ci/native-completion-probe.rb --phase small --oracle "$GITHUB_WORKSPACE/oracle" --out "$RUNNER_TEMP/native-completion" > "$RUNNER_TEMP/native-completion/probe.stdout" 2> "$RUNNER_TEMP/native-completion/probe.stderr"
      - name: Upload the small reference probe immediately
        if: ${{ !inputs.unicode_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: native-completion-small-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-completion
          if-no-files-found: error
          retention-days: 7
      - name: Generate targeted UnitsML tables
        if: ${{ !inputs.unicode_probe_only }}
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/oracle/Gemfile
          BUNDLE_FROZEN: "true"
        run: |
          bundle exec ruby scripts/ci/native-completion-probe.rb --phase tables --oracle "$GITHUB_WORKSPACE/oracle" --out "$RUNNER_TEMP/native-completion" > "$RUNNER_TEMP/native-completion/tables.stdout" 2> "$RUNNER_TEMP/native-completion/tables.stderr"
      - name: Measure still-unreached Unicode rules
        if: ${{ inputs.unicode_unreached_probe }}
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/oracle/Gemfile
          BUNDLE_FROZEN: "true"
        run: |
          bundle exec ruby scripts/ci/unicode-unreached-probe.rb --oracle "$GITHUB_WORKSPACE/oracle" --out "$RUNNER_TEMP/native-completion" --seconds 300 > "$RUNNER_TEMP/native-completion/unreached.stdout" 2> "$RUNNER_TEMP/native-completion/unreached.stderr"
      - name: Retain targeted measurements and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-completion-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-completion
          if-no-files-found: error
          retention-days: 7

  native-completion-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_completion_test }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Initialize integration evidence
        run: mkdir -p "$RUNNER_TEMP/native-completion-test"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Run focused integration checks and retain every exit
        run: |
          set +e
          evidence="$RUNNER_TEMP/native-completion-test"
          failed=0
          check_stage() {
            stage="$1"
            shift
            "$@" > "$evidence/$stage.log" 2>&1
            result=$?
            printf '{"stage":"%s","exit":%s}\n' "$stage" "$result" >> "$evidence/exits.jsonl"
            cat "$evidence/$stage.log"
            if [ "$result" -ne 0 ]; then failed=1; fi
          }
          check_stage install pnpm install --frozen-lockfile --ignore-scripts
          check_stage biome pnpm exec biome check .
          check_stage typecheck pnpm typecheck
          check_stage build pnpm build
          check_stage focused-tests pnpm exec vitest run test/unitsml-inline-integration.spec.ts test/parse.spec.ts test/compat/plurimath-class.spec.ts test/formats/unitsml test/formats/unicodemath/completion-parity.spec.ts test/formats/unicodemath/model-parity.spec.ts test/formats/unicodemath/render-parity.spec.ts test/formats/unicodemath/renderer.spec.ts
          check_stage package pnpm gate:package
          exit "$failed"
      - name: Upload focused integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-completion-test-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-completion-test
          if-no-files-found: error
          retention-days: 7

  leptris-consumer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.leptris_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.leptris_repository }}
          ref: ${{ inputs.leptris_ref }}
          path: .leptris-binding
      - uses: actions/checkout@v5
        with:
          repository: leptris/leptris
          ref: v1.9.356
          path: .leptris-engine
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Candidate provenance
        run: |
          git -C .leptris-binding rev-parse HEAD
          git -C .leptris-engine rev-parse HEAD
      - name: Build candidate WASM
        working-directory: .leptris-binding
        run: ENGINESRC="$GITHUB_WORKSPACE/.leptris-engine/src" ./build.sh
      - name: Binding regressions
        working-directory: .leptris-binding
        run: npm test
      - run: pnpm install --frozen-lockfile
      - name: Real MathML and OMML consumer gate
        run: node scripts/probe-leptris.mjs .leptris-binding/src/index.js
