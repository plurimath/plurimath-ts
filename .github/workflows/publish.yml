name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (must match package.json)
        required: true
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const requested = process.env.GITHUB_REF_TYPE === 'tag'
            ? process.env.GITHUB_REF_NAME.slice(1) : process.env.REQUESTED_VERSION;
          assert.equal(pkg.name, '@plurimath/plurimath-ts');
          assert.notEqual(pkg.private, true);
          assert.equal(requested, pkg.version, 'Requested version must match package.json');
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up npm trusted publishing
        run: npm install --global npm@^11
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Verify packed installation
        id: package
        run: node scripts/smoke-package.mjs
      - name: Publish verified tarball
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public
