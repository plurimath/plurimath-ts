name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (must match package.json)
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # The provenance gates read scripts from their recorded
          # commits (`git show <sha>:path`) — a shallow checkout
          # cannot resolve them (the CI check job fetches full
          # history for the same reason).
          fetch-depth: 0
      - name: Verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const requested = process.env.GITHUB_REF_TYPE === 'tag'
            ? process.env.GITHUB_REF_NAME.slice(1) : process.env.REQUESTED_VERSION;
          assert.equal(pkg.name, '@plurimath/plurimath');
          assert.notEqual(pkg.private, true);
          assert.equal(requested, pkg.version, 'Requested version must match package.json');
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up npm trusted publishing
        run: npm install --global npm@^11
      # The github: stage deps (@plurimath/amath-ts and friends) build in
      # their `prepare` lifecycle script; --ignore-scripts skips it and the
      # browser entries their consumers import never exist (the same
      # install the CI check job uses, which is green).
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify packed installation
        id: package
        run: node scripts/smoke-package.mjs
      - name: Publish verified tarball
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        # Idempotent: re-dispatching an already-published version is a
        # no-op (npm would 409 it), not a failure to mask.
        run: |
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish"
          else
            npm publish "$TARBALL" --provenance --access public
          fi

  alias:
    # The unscoped `plurimath` alias — a thin re-export of the scoped
    # package for casual consumers. Its version (and its dependency
    # pin) sync with the main package at publish time; the first
    # publish needs the unscoped name's trusted publisher registered
    # on npmjs.com (same binding: this repo, this workflow).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set up npm trusted publishing
        run: npm install --global npm@^11
      - name: Sync the alias version with the main package
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          const main = JSON.parse(readFileSync('package.json', 'utf8'));
          const path = 'npm/plurimath-alias/package.json';
          const alias = JSON.parse(readFileSync(path, 'utf8'));
          alias.version = main.version;
          alias.dependencies['@plurimath/plurimath'] = main.version;
          writeFileSync(path, JSON.stringify(alias, null, 2) + '\n');
          console.log(`plurimath@${alias.version} -> @plurimath/plurimath@${main.version}`);
          JS
      - name: Publish the alias
        working-directory: npm/plurimath-alias
        # Idempotent, same as the main publish above.
        run: |
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish"
          else
            npm publish --provenance --access public
          fi
